name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      create_release:
        type: boolean
        description: 'Create or update the GitHub release with the APK'
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build and release the APK
    runs-on: ubuntu-latest
    concurrency:
      group: android-release-build
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # First-party caching instead of gradle/actions/setup-gradle. The distribution itself
      # is verified by distributionSha256Sum in gradle-wrapper.properties, which is the
      # wrapper's own check and needs no action to run it.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Robolectric fetches its Android image into ~/.m2 at test time, which the
      # Gradle cache above does not cover. One image, pinned in
      # app/src/test/resources/robolectric.properties, so one entry is enough.
      - name: Cache Robolectric's Android image
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: robolectric-${{ runner.os }}-${{ hashFiles('android/app/src/test/resources/robolectric.properties') }}
          restore-keys: |
            robolectric-${{ runner.os }}-

      # No version is computed here. The build reads android/version.properties,
      # so a commit always produces the same numbers, which is what F-Droid
      # requires. Bump it locally with scripts/version.sh write and commit it.
      # A tag must agree with that file, and this fails if it does not.
      - name: Read version
        id: version
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            scripts/version.sh check-tag "${GITHUB_REF_NAME}"
            echo "PRERELEASE=false" >> "$GITHUB_OUTPUT"
          else
            echo "PRERELEASE=true" >> "$GITHUB_OUTPUT"
          fi
          read -r name code < <(scripts/version.sh show)
          echo "BUILD_NAME=$name" >> "$GITHUB_OUTPUT"
          echo "BUILD_NUMBER=$code" >> "$GITHUB_OUTPUT"
          echo "committed version: $name ($code)"

      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No RELEASE_KEYSTORE_BASE64 secret, so this APK is debug-signed. Add the keystore secrets before you enter real credentials on a device."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Run tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build APK
        id: assemble
        working-directory: android
        env:
          RELEASE_KEYSTORE_PATH: ${{ steps.keystore.outputs.signed == 'true' && format('{0}/release.keystore', runner.temp) || '' }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            ./gradlew :app:assembleRelease --console=plain
            echo "apk=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
          else
            ./gradlew :app:assembleDebug --console=plain
            echo "apk=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
          fi

      # Key material only the signing step needs. Removed as soon as it has been used, and
      # on failure too, so it does not sit on the runner while the artifact is uploaded and
      # the release is published.
      - name: Remove the keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.keystore"

      - name: Name the APK and checksum it
        id: apk
        run: |
          set -euo pipefail
          src="android/${{ steps.assemble.outputs.apk }}"
          suffix=""
          [ "${{ steps.keystore.outputs.signed }}" = "true" ] || suffix="-debugsigned"
          out="MyDIDStation-${{ steps.version.outputs.BUILD_NAME }}-${{ steps.version.outputs.BUILD_NUMBER }}${suffix}.apk"
          cp "$src" "$out"
          sha=$(sha256sum "$out" | cut -d' ' -f1)
          size=$(du -h "$out" | cut -f1)
          echo "path=$out" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          {
            echo "### My DID Station ${{ steps.version.outputs.BUILD_NAME }} (${{ steps.version.outputs.BUILD_NUMBER }})"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| APK | \`$out\` ($size) |"
            echo "| SHA-256 | \`$sha\` |"
            echo "| Signing | $([ "${{ steps.keystore.outputs.signed }}" = "true" ] && echo 'release key' || echo 'debug key') |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.version.outputs.BUILD_NAME }}-${{ steps.version.outputs.BUILD_NUMBER }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish release
        if: ${{ github.event_name == 'push' || inputs.create_release }}
        # gh is preinstalled on GitHub-hosted runners, so publishing needs no third-party
        # action and nothing to pin. This replaces softprops/action-gh-release, which was
        # the only unowned code in this file.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.BUILD_NAME }}
          NAME: ${{ steps.version.outputs.BUILD_NAME }}
          APK: ${{ steps.apk.outputs.path }}
          SHA256: ${{ steps.apk.outputs.sha }}
          VERSION_CODE: ${{ steps.version.outputs.BUILD_NUMBER }}
          PRERELEASE: ${{ steps.version.outputs.PRERELEASE }}
          SIGNED: ${{ steps.keystore.outputs.signed }}
        run: |
          set -euo pipefail
          if [ "$SIGNED" = "true" ]; then signing="the release key"; else signing="the debug key"; fi
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          My DID Station $NAME.

          - Commit: $GITHUB_SHA
          - Triggered by: ${GITHUB_TRIGGERING_ACTOR:-$GITHUB_ACTOR}
          - Signed with: $signing
          - SHA-256: $SHA256

          versionCode is $VERSION_CODE, so a newer build always installs over an older
          one. Point Obtainium at this repository and turn on prereleases.

          Version scheme: see scripts/version.sh. The committed
          android/version.properties is what F-Droid builds.
          NOTES
          flags=(--title "$NAME" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes --latest)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          # A tag build already has its tag. A branch push still has to create one, and it
          # has to point at the commit that was just built.
          if [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then flags+=(--target "$GITHUB_SHA"); fi
          gh release create "$TAG" "$APK" "${flags[@]}"

