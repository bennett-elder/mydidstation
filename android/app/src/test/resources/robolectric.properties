# One Android image for the whole suite. Without this, every @Config(sdk = ...)
# pulls its own android-all jar, which is the slowest part of a cold test run.
#
# 35 is the ceiling here, not a preference: Robolectric refuses to build a
# sandbox above 35 on JDK 17, and this project builds on 17 (AGENTS.md). Moving
# the toolchain to 21 is what would raise this, not a newer Robolectric.
sdk=35
